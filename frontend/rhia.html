<script>

  try { var t = localStorage.getItem("screener:tema"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}

  // Config PÚBLICA. A anon key é a chave publicável (identifica a aplicação, não

  // memória/localStorage e só viaja no header x-session-token.
  // Em desenvolvimento, scripts/dev-rhia.mjs injeta outro SCREENER_RHIA_CONFIG
  // no fim do head (antes do fechamento), DEPOIS deste bloco — e por isso
  // sobrescreve o valor de produção abaixo. (Nunca escreva a tag de fechamento
  // do head dentro deste script: a injeção substitui a primeira ocorrência
  // dela no HTML.)
  window.SCREENER_RHIA_CONFIG = {
    EDGE_URL: "https://klnpnjumogojspubyabi.supabase.co/functions/v1/screener",
    ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsbnBuanVtb2dvanNwdWJ5YWJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1ODI1NjcsImV4cCI6MjA5NjE1ODU2N30.D3L-wybr8jf0Esi3HcJC2kMrmqrBgKfQ3KIo8dV0DUI"
  };

  // Nunca tela branca: se o módulo não arrancar em 8s (rede, navegador sem
  // suporte a módulos ES, erro de carga), mostra uma mensagem útil na página.
  setTimeout(function () {
    if (window.__rhiaPronto) return;
    var el = document.getElementById("sc-app");
    if (el && el.querySelector(".rh-boot")) {
      el.innerHTML = '<div class="sc-shell"><div class="sc-card" role="alert"><h1 class="sc-title">Não foi possível iniciar o diagnóstico</h1><p class="sc-lead">A página não conseguiu carregar a aplicação. Verifique a conexão e recarregue. Se persistir, tente um navegador atualizado ou avise quem enviou o link.</p></div></div>';
    }
  }, 8000);
</script>
